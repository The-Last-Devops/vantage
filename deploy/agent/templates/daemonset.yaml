{{- if not .Values.hubUrl }}{{ fail "set hubUrl to where the hub is reachable (e.g. --set hubUrl=https://vantage.example.com)" }}{{- end }}
{{- if not .Values.apiKey }}{{ fail "set apiKey to an API key created in the UI under Add System (--set apiKey=...)" }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
type: Opaque
stringData:
  api-key: {{ .Values.apiKey | quote }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
  labels: { app: {{ .Release.Name }} }
spec:
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: {{ .Release.Name }} }
    spec:
      {{- with .Values.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.pullPolicy }}
          env:
            - { name: HUB_URL, value: {{ .Values.hubUrl | quote }} }
            - { name: AGENT_KIND, value: "k8s" }
            - { name: CLUSTER, value: {{ .Values.cluster | quote }} }
            # Reverse shell tunnel: the hub SSHes into this host via 127.0.0.1:<sshd>.
            # The agent binary has this ON by default, so the env var is emitted ONLY to
            # opt a host out (allowShell: false) — that way upgrading the agent image is
            # enough to enable it, with no stale ALLOW_SHELL=0 left in the pod spec.
            # The node must run sshd (hostNetwork=true makes the agent's localhost:22 the
            # node's sshd). Access is still gated hub-side by require_exec (owner +
            # can_exec) + a step-up password + the host's own SSH auth.
            {{- if not .Values.allowShell }}
            - { name: ALLOW_SHELL, value: "0" }
            {{- end }}
            - { name: DISK_PATH, value: "/host" }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}, key: api-key } }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: host-root, mountPath: /host, readOnly: true }
      volumes:
        - name: host-root
          hostPath: { path: / }
