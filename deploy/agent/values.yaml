# vantage AGENT chart — deploy after the hub, with a token you create in the
# UI under Add System. One DaemonSet pod runs per node and pushes host metrics.

image:
  repository: ghcr.io/the-last-devops/vantage-agent
  # Empty = the chart's appVersion (an upgrade to chart X always lands image X, even with
  # --reuse-values). Set a value to pin another image or track a moving tag like "main".
  tag: ""
# Interactive shell/console: the agent opens a reverse tunnel so the hub can SSH into this
# host (via the node's sshd on 127.0.0.1). **ON by default** — set false to opt a host out.
# The tunnel is not the security boundary: it is a forward-only byte pipe to loopback sshd,
# and the hub stores no usable credential. Using it still requires RBAC (owner + the exec
# capability, `rbac::require_exec`), a step-up password, and the host's own SSH auth — so a
# user without the exec permission cannot open a console even with the tunnel up. The node
# must run sshd. See docs/exec-design.md.
allowShell: true
# One-per-cluster collector (k8s object + per-container stats → the Cluster page). Deploys
# a Deployment + read-only ClusterRole alongside the per-node DaemonSet.
clusterAgent:
  enabled: true
pullPolicy: IfNotPresent
pullSecrets: []          # e.g. [ghcr] for private packages

# Where the hub is reachable from inside this cluster.
#  - same cluster as the hub:  http://<release>-hub.<hub-namespace>:8080
#  - different cluster:         the hub's public URL, e.g. https://vantage.example.com
hubUrl: ""

# API key from the UI (Add System). Required.
apiKey: ""

# Label that groups this cluster's nodes in the UI (Kubernetes › <cluster>).
cluster: my-cluster

resources:
  requests: { cpu: 20m, memory: 32Mi }
  limits: { memory: 128Mi }
